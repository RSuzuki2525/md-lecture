<div class="wrap">
  <nav class="steps" aria-label="講義の段階"><a href="index.html">講義の流れ</a><a href="lj-box.html#force">1 力場</a><a href="jump-integrator.html">2 時間積分</a><a href="thermo-room.html">3 温度・圧力</a><a href="lj-box.html#props">4 物性へ</a><a href="molecule.html">＋ 小分子</a><a href="polymer.html" aria-current="page">＋ 高分子</a></nav>
  <header>
    <h1>高分子の鎖</h1>
    <p>ビーズをつないだ鎖。硬さ・溶媒・温度を変えて、広がり方・ゴムのような弾性・固まり方を見る。</p>
  </header>

  <div class="screen">
    <canvas id="cv" tabindex="0" aria-label="鎖の画面。矢印キーでキャラが上下左右に泳ぐ"></canvas>

  </div>
  <div class="pad" aria-label="タッチ操作">

  </div>

    <section class="card" aria-label="操作">

        <div class="seg">

          <button id="bQuench">急冷（T₀ = 0.05）</button>

        </div>
      </div>

        <div class="label">ビーズの色</div>
        <div class="seg" id="colSeg">
          <button data-c="chain">鎖ごと</button>

    <section class="card" aria-label="測定値">
      <h2>測定値</h2>
      <dl>
        <dt>温度 T</dt><dd id="rT"></dd>
        <dt id="rRt">末端間距離 R / 回転半径 Rg</dt><dd id="rR"></dd>
        <dt id="rXt">鎖がキャラを引く力 F（1τ 平均）</dt><dd id="rX"></dd>
      </dl>
    </section>
  </div>
  <p class="explain" id="explain"></p>
</div>

<script>
(() => {
  // ---------- parameters (reduced units: m = k_B = 1; LJ core ε = 1) ----------
  const TS = 3, TS_1 = 5;                             // τ per real second: melt / single chain
  const A_HERO = 1.0, M_HERO = 20, THRUST = 3, GAM_H = 0.8;
  const GAMMA = 0.5, GAMMA_1 = 0.2;                   // Langevin friction: melt / single chain (lower = recoils faster)
  const WCA_H = 2 ** (1 / 6), K_TETHER = 15, R_TETHER = 2.2, K_ANCHOR = 50, F_CAP = 20;
  const M_HERO_GRAB = 2;                              // lighter while tied, so the chain's pull is felt
  let N_CH = 12, L_CH = 10;                           // melt: 12 chains × 10 beads
  const T_HOT = 2, T_COLD = 0.05, RAMP_TAU = 180;     // slow cooling: 180τ = 60 s on screen
  const DEF = { kb: 400, r0: 1, ka: 0, th0: 180, sig: 1 };
  const P = { mode: 'single', ...DEF, eps: 0, T0: 1, N: 30, dt: 0.005, slowmo: false, grab: false,
              color: 'chain', paused: false, ramp: null };
  const KEYMAP = { ArrowLeft: 'L', a: 'L', ArrowRight: 'R', d: 'R', ArrowUp: 'U', w: 'U', ' ': 'U', ArrowDown: 'D', s: 'D' };

  const EXPLAIN = {
    single: '<b>1本の鎖</b>：ビーズを結合（バネ）でつないだ鎖。「鎖の硬さ」は角度の項の強さ、「溶媒」はビーズどうしの引力。力場の1つ1つの項は「＋ 小分子」で見る。',
    melt: '<b>メルト</b>：鎖 12 本 × 10 ビーズを周期境界の箱に詰めた。「熱する」で溶かしてから冷やし方を比べる。おすすめは「やや硬い k_θ = 3」で急冷とゆっくりを比べること。',
    pluck: '<b>結合をはじいた</b>：真ん中の結合を 1.3 倍に伸ばして離した。グラフが振動する。k_b を大きくすると周期が短くなる（周期 = 2π/√(2k_b/m)）。',
    boom: '<b>爆発した！</b> Δt が結合の振動の周期にくらべて大きすぎると、速度ベレ法でも計算がこわれる（目安：Δt が周期の 1/10 より小さいこと）。Δt を小さくするか k_b を下げて「リセット」。',
    grab: '<b>鎖の一端を壁、もう一端をキャラにつないだ</b>：右へ泳いで引っぱると、鎖がキャラを<b>引き戻す</b>（赤い矢印）。キーを離すと壁の方へ戻される。ε = 0（引力なし）でも戻るのは、のびた形は<b>並び方の数が少ない＝エントロピーが小さい</b>から（エントロピー弾性。ゴムと同じ）。のびきりに近いほど力が急に強くなる。温度を上げると同じのびでも力が強くなる（右下のグラフで比べる）。',
    good: '<b>良溶媒</b>（ε ≈ 0）：ビーズどうしは反発だけ。鎖は広がった<b>コイル</b>になる。',
    mid: '<b>中間</b>：引力と広がろうとする力がほぼつり合う。Rg が大きく揺れる。',
    poor: '<b>貧溶媒</b>（ε 大）：ビーズどうしが引き合い、鎖が丸まった<b>グロビュール</b>になる（コイル–グロビュール転移）。Rg が小さくなる。',
    quench: '<b>急冷</b>：鎖が並び直す前に動けなくなる＝<b>ガラス</b>。「やや硬い」鎖なら、ゆっくり冷やしたときより U/N が高く、並びのそろい S が低いまま止まる。',
    slow: '<b>ゆっくり冷やす</b>：右下に U/N を温度に対して描く。途中で<b>急に下がる</b>所があれば<b>結晶化</b>（鎖が平行に並ぶ。S が上がる）、なめらかに曲がるだけなら<b>ガラス転移</b>。柔らかい鎖は結晶しにくく、硬い鎖は急冷でも結晶する。灰色は前の結果。',
    orient: '色＝<b>結合の向き</b>（180° 回すと同じ色）。同じ色がそろった帯＝鎖が平行に並んだ<b>結晶</b>の部分。'
  };

  // ---------- state ----------
  let LX = 30, LY = 15.75, pbc = false;
  let beads = [], bonds = [], angles = [], hero, Ub = 0, Ua = 0, Ul = 0, simT = 0, exploded = false;
  let lastMsg = null, tension = 0, fAvg = 0, grabT = 0, Snem = NaN;
  const histB = [], histR = [], runs = [];   // bond length per step; [R, Rg] per 0.1 s; U/N vs T runs
  const feSets = [];                          // force–extension: [{T, pts:[[R, F]]}], newest last
  const keys = { L: false, R: false, U: false, D: false };

  function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
  const wrapX = d => d - LX * Math.round(d / LX), wrapY = d => d - LY * Math.round(d / LY);
  function sep(a, b) { let dx = b.x - a.x, dy = b.y - a.y; if (pbc) { dx = wrapX(dx); dy = wrapY(dy); } return [dx, dy]; }

  function addChain(pts, c) {
    const s = Math.sqrt(P.T0), i0 = beads.length;
    pts.forEach(([x, y], k) => {
      beads.push({ x, y, vx: gauss() * s, vy: gauss() * s, ax: 0, ay: 0, c, wx: 0, wy: 0 });
      if (k > 0) bonds.push([i0 + k - 1, i0 + k]);
      if (k > 1) angles.push([i0 + k - 2, i0 + k - 1, i0 + k]);
    });
  }
  function reset() {
    beads = []; bonds = []; angles = []; exploded = false; lastMsg = null;
    histB.length = 0; histR.length = 0; P.ramp = null;
    if (P.mode === 'single') {
      LX = 30; LY = 15.75; pbc = false;
      // serpentine start, rows of ≤ 14 beads, centred
      const row = Math.min(14, P.N), pts = [];
      const nRows = Math.ceil(P.N / row), x0 = LX / 2 - (row - 1) * P.r0 / 2, y0 = LY / 2 - (nRows - 1) * 1.2 / 2;
      for (let k = 0; k < P.N; k++) {
        const r = Math.floor(k / row), j = k % row, jj = r % 2 ? row - 1 - j : j;
        pts.push([x0 + jj * P.r0, y0 + r * 1.2]);
      }
      addChain(pts, 0);
      hero = { x: 3, y: 3, vx: 0, vy: 0, ax: 0, ay: 0, fx: 0, fy: 0, face: 1 };
    } else {
      LX = 20; LY = 10.5; pbc = true;
      for (let c = 0; c < N_CH; c++) {
        const y = (c + 0.5) * LY / N_CH, pts = [];
        const x0 = 0.6 + (c % 2) * 6;                  // staggered rows
        for (let k = 0; k < L_CH; k++) pts.push([x0 + k * 1.0, y]);
        addChain(pts, c);
      }
      hero = { x: LX - 1.8, y: LY / 2, vx: 0, vy: 0, ax: 0, ay: 0, fx: 0, fy: 0, face: -1 };
    }
    forces(); heroAcc();
  }

  function temperature() {
    let k = 0; for (const b of beads) k += b.vx * b.vx + b.vy * b.vy;
    return beads.length ? 0.5 * k / beads.length : 0;
  }

  // ---------- force field ----------
  // non-bonded: WCA core (ε_core = 1) + attractive LJ tail scaled by ε, cut at 2.5σ; 1-2 pairs excluded
  const LJ_RC = 4 * (0.4 ** 12 - 0.4 ** 6);   // LJ(2.5σ)/ε, the tail's shift
  function ljPair(r2) {
    const sg2 = P.sig * P.sig, rc2 = 6.25 * sg2, rm2 = 2 ** (1 / 3) * sg2;
    if (r2 >= rc2 || (P.eps === 0 && r2 >= rm2)) return null;
    const q = sg2 / Math.max(r2, 0.25 * sg2), q6 = q * q * q, f = 24 * q6 * (2 * q6 - 1) / Math.max(r2, 0.25 * sg2);
    const c = LJ_RC, lj = 4 * q6 * (q6 - 1);
    if (r2 < rm2) return { f, u: lj + 1 - P.eps * (1 + c) };
    return { f: P.eps * f, u: P.eps * (lj - c) };
  }
  const ULJ = r => { const p = ljPair(r * r); return p ? p.u : 0; };

  function forces() {
    for (const b of beads) { b.ax = 0; b.ay = 0; }
    hero.fx = 0; hero.fy = 0;
    let ul = 0, ub = 0, ua = 0;
    const n = beads.length, rcut = 2.5 * P.sig;
    for (let i = 0; i < n; i++) {
      const a = beads[i];
      for (let j = i + 1; j < n; j++) {
        const c = beads[j];
        if (j === i + 1 && a.c === c.c) continue;     // bonded neighbours: excluded
        let dx = c.x - a.x; if (pbc) dx = wrapX(dx);
        if (dx > rcut || dx < -rcut) continue;
        let dy = c.y - a.y; if (pbc) dy = wrapY(dy);
        const p = ljPair(dx * dx + dy * dy);
        if (!p) continue;
        a.ax -= p.f * dx; a.ay -= p.f * dy; c.ax += p.f * dx; c.ay += p.f * dy; ul += p.u;
      }
      // bead ↔ hero: purely repulsive, shifted out by the hero's radius
      const [dx, dy] = sep(hero, a), r = Math.hypot(dx, dy), s = r - A_HERO;
      if (s < WCA_H && r > 1e-9) {
        const ss = Math.max(s, 0.75), i6 = ss ** -6, f = 24 * i6 * (2 * i6 - 1) / ss / r;
        a.ax += f * dx; a.ay += f * dy; hero.fx -= f * dx; hero.fy -= f * dy;
      }
    }
    for (const [i, j] of bonds) {                    // U = k_b/2 (r − r₀)²
      const a = beads[i], c = beads[j], [dx, dy] = sep(a, c), r = Math.hypot(dx, dy) || 1e-9;
      const f = -P.kb * (r - P.r0) / r;
      c.ax += f * dx; c.ay += f * dy; a.ax -= f * dx; a.ay -= f * dy; ub += 0.5 * P.kb * (r - P.r0) ** 2;
    }
    if (P.ka > 0) {                                  // U = k_θ (1 − cos(θ − θ₀)) ≈ k_θ/2 (θ − θ₀)²
      const t0 = P.th0 * Math.PI / 180;
      for (const [i, j, k] of angles) {
        const bi = beads[i], bj = beads[j], bk = beads[k];
        const [x1, y1] = sep(bj, bi), [x2, y2] = sep(bj, bk);
        const n1 = Math.hypot(x1, y1) || 1e-9, n2 = Math.hypot(x2, y2) || 1e-9;
        const cs = Math.max(-1, Math.min(1, (x1 * x2 + y1 * y2) / (n1 * n2))), th = Math.acos(cs);
        // dU/dcosθ = −k_θ sin(θ − θ₀)/sinθ; for θ₀ = 180° this is exactly +k_θ, otherwise sinθ is kept off 0

    $('bGrab').setAttribute('aria-pressed', String(P.grab)); $('bGrab').textContent = P.grab ? 'はなす' : '鎖を壁とキャラにつなぐ';
    $('bSlow').setAttribute('aria-pressed', String(!!P.ramp)); rampShown = !!P.ramp;
    $('bSlow').textContent = P.ramp ? `ゆっくり冷やす中… 残り ${Math.ceil((RAMP_TAU - (simT - P.ramp.t0)) / TS)} 秒` : 'ゆっくり冷やす（60 秒）';
    $('bPause').setAttribute('aria-pressed', String(P.paused)); $('bPause').textContent = P.paused ? '再開' : '一時停止';
    $('bPause').disabled = exploded;
    $('h4t').textContent = melt ? '冷やしながら測る U/N（急に下がる＝結晶化、なめらか＝ガラス転移）'
      : P.grab ? '力–のび曲線 F と R（灰色＝前の温度）' : '鎖の広がり：末端間距離 R と回転半径 Rg';
    $('rRt').textContent = melt ? '1本あたりの R / Rg（平均）' : '末端間距離 R / 回転半径 Rg';
    $('rXt').textContent = melt ? '並びのそろい S（1 = 平行）' : '鎖がキャラを引く力 F（1τ 平均）';
    const bd = $('badge'); bd.classList.toggle('boom', exploded);
    bd.textContent = exploded ? '計算がこわれた（リセット）' : (melt ? 'メルト' : '1本の鎖') + ' · T₀ = ' + P.T0.toFixed(2);
    let ex;
    if (lastMsg) ex = EXPLAIN[lastMsg];
    else if (melt) ex = EXPLAIN.melt;
    else ex = EXPLAIN.single + '<br>' + (P.eps < 0.3 ? EXPLAIN.good : P.eps < 1 ? EXPLAIN.mid : EXPLAIN.poor);
    if (melt && P.color === 'orient') ex += '<br>' + EXPLAIN.orient;
    $('explain').innerHTML = ex;
  }

  $('sT').addEventListener('input', e => { P.T0 = +e.target.value; P.ramp = null; syncUI(); });
  $('sN').addEventListener('input', e => { P.N = +e.target.value; reset(); syncUI(); });
  document.querySelectorAll('#modeSeg button').forEach(b => b.addEventListener('click', () => {
    if (P.mode === b.dataset.m) return;
    P.mode = b.dataset.m; P.grab = false; lastMsg = null;
    if (P.mode === 'melt') { P.eps = 1; P.T0 = T_HOT; P.ka = 3; } else { P.eps = 0; P.T0 = 1; P.ka = 0; }
    reset(); syncUI(); drawCharts();
  }));
  document.querySelectorAll('#solvSeg button').forEach(b => b.addEventListener('click', () => { P.eps = +b.dataset.e; lastMsg = null; syncUI(); drawCharts(); }));
  document.querySelectorAll('#colSeg button').forEach(b => b.addEventListener('click', () => { P.color = b.dataset.c; syncUI(); }));
  document.querySelectorAll('#kaSeg button').forEach(b => b.addEventListener('click', () => { P.ka = +b.dataset.k; P.th0 = 180; syncUI(); drawCharts(); }));
  const stiffName = () => P.ka === 0 ? '柔らかい' : P.ka < 4.5 ? 'やや硬い' : '硬い';
  $('bGrab').addEventListener('click', () => {
    P.grab = !P.grab; lastMsg = P.grab ? 'grab' : null; fAvg = 0; grabT = simT;
    if (P.grab) feSets.length = 0;
    forces(); syncUI(); drawCharts();
  });
  $('bHeat').addEventListener('click', () => { P.ramp = null; P.T0 = T_HOT; lastMsg = null; syncUI(); });
  function newRun(label) { runs.push({ label, pts: [] }); if (runs.length > 3) runs.shift(); lastRun = 0; }
  $('bQuench').addEventListener('click', () => { P.ramp = null; P.T0 = T_COLD; newRun(stiffName() + '・急冷'); lastMsg = 'quench'; syncUI(); });
  $('bSlow').addEventListener('click', () => {
    if (P.ramp) { P.ramp = null; syncUI(); return; }
    P.ramp = { t0: simT, from: P.T0 }; newRun(stiffName() + '・ゆっくり'); lastMsg = 'slow'; syncUI();
  });
  $('bPause').addEventListener('click', () => { P.paused = !P.paused; syncUI(); });
  $('bReset').addEventListener('click', () => { P.paused = false; reset(); syncUI(); drawCharts(); });

  addEventListener('keydown', e => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' && e.key.startsWith('Arrow')) return;
    if (tag === 'BUTTON' && e.key === ' ') return;
    const k = KEYMAP[e.key];
    if (k) { keys[k] = true; e.preventDefault(); }
  });
  addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
  function hold(id, k) {
    const el = $(id);
    el.addEventListener('pointerdown', e => { keys[k] = true; el.setPointerCapture(e.pointerId); });
    for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) el.addEventListener(t, () => keys[k] = false);
  }
  hold('bL', 'L'); hold('bR', 'R'); hold('bU', 'U'); hold('bD', 'D');
  cv.addEventListener('pointerdown', () => cv.focus());

  reset(); syncUI();
  requestAnimationFrame(frame);
})();
</script>

</html>
